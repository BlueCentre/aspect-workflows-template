name: Copybara Import PR

# ONE-WAY PR-import for every one-way-mirrored component -- SCHEDULED-POLL variant
# (only generated when `copybara_one_way` was chosen). One matrix leg per
# component.
#
# The MONOREPO polls <org>/<component> for open PRs labelled 'import-to-monorepo'
# and, for EACH match, opens/updates a MONOREPO PR under <component>/ for human
# review + merge. The monorepo is the single source of truth; nothing is pushed to
# monorepo main here. The Copybara invocation itself lives in the tested Go wrapper
# (//tools/copybara/sync import_pr), which handles the @@PR_NUMBER@@ rewrite and
# COPYBARA_SOURCEREF; this workflow owns the poll, the credential, and the tidy.
#
# WHY POLL (NOT repository_dispatch): a scheduled poll keeps ALL control flow
# inside the monorepo. A standalone repo never triggers a monorepo workflow and
# never supplies workflow inputs, so there is no path for PR-influenced input
# (e.g. an attacker-controlled PR number) to reach this job. The maintainer
# approval gate is simply "apply the label in the mirror UI"; the monorepo decides
# what to import, on its own schedule, with its own credential.
#
# CREDENTIAL (GitHub App, HTTPS only -- do NOT reintroduce SSH or a PAT):
#   Each matrix leg mints a SHORT-LIVED installation token from the copybara-sync
#   GitHub App (secrets.SYNC_APP_ID / secrets.SYNC_APP_PRIVATE_KEY, provisioned by
#   infrastructure/pulumi/copybara_sync), scoped to exactly TWO repos: <component>
#   (read its PRs) and this monorepo (push the import branch + open the PR). The
#   token expires ~1h after the job. The App must be granted Pull-requests:write
#   and installed on the monorepo + every one-way mirror, or token minting fails
#   closed.
#
# SECURITY POSTURE (do NOT weaken):
#   * Triggers are `schedule` + `workflow_dispatch` only -- no pull_request_target
#     and no repository_dispatch, so the App token is never exposed to a trigger
#     evaluated in the context of untrusted PR head code.
#   * This job NEVER builds/tests/executes the imported PR content. Copybara
#     applies only core.move + the loop-prevention dynamic_transform. The single
#     build step (//:tidy) regenerates gazelle BUILD files and is monorepo-owned
#     tooling.
#   * fail-fast:false with a per-component concurrency group, so one component's
#     poll failure neither cancels nor blocks the others.

on:
    schedule:
        # Poll every 15 minutes for newly-labelled import PRs across all mirrors.
        - cron: "*/15 * * * *"
    workflow_dispatch:
        inputs:
            only_component:
                description: "Limit this manual run to one component. Empty = all."
                default: ""
                required: false
            poll_only:
                description: "If 'true', list matching PRs and exit without importing (debugging)."
                default: "false"
                required: false

# Minimal token: all repo writes go through the per-leg App token, not this
# workflow's GITHUB_TOKEN, which only needs to check out the monorepo.
permissions:
    contents: read

jobs:
    poll-and-import:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                component: [{{ copybara_components | join(", ") }}]
        # Serialize poll cycles PER COMPONENT so two runs cannot race the same
        # monorepo PR branch / GitHub API. cancel-in-progress:false means a queued
        # cycle waits rather than pre-empting an in-flight import.
        concurrency:
            group: copybara-import-pr-${{ '{{' }} matrix.component {{ '}}' }}
            cancel-in-progress: false
        # Bound the whole cycle well under the 15-minute cron interval.
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  # CRITICAL: without this, checkout injects an http extraheader
                  # carrying the read-only workflow GITHUB_TOKEN that SHADOWS the
                  # App-token ~/.git-credentials store for host-side `git push`, so
                  # the tidy push would 403. (The Go sync wrapper's docker container
                  # has its own git config and is unaffected.)
                  persist-credentials: false

            - name: Install Bazel
              uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true

            - name: Mint scoped GitHub App token (<component> + monorepo)
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ '{{' }} secrets.SYNC_APP_ID {{ '}}' }}
                  private-key: ${{ '{{' }} secrets.SYNC_APP_PRIVATE_KEY {{ '}}' }}
                  owner: ${{ '{{' }} github.repository_owner {{ '}}' }}
                  repositories: |
                      ${{ '{{' }} matrix.component {{ '}}' }}
                      {{ project_kebab }}

            - name: Set up Copybara auth (HTTPS App token only)
              env:
                  IMPORT_TOKEN: ${{ '{{' }} steps.app-token.outputs.token {{ '}}' }}
              run: |
                  set -euo pipefail
                  # HTTPS git-credentials cover BOTH repos: the App token reads the
                  # mirror (github_pr_origin) and writes the monorepo
                  # (github_pr_destination + tidy push). No SSH key is mounted.
                  printf 'https://x-access-token:%s@github.com\n' "$IMPORT_TOKEN" > ~/.git-credentials
                  chmod 600 ~/.git-credentials
                  printf '[credential]\n\thelper = store\n[user]\n\tname = {{ project_pascal }} Sync\n\temail = sync@example.com\n' > ~/.gitconfig

            - name: Poll mirror for labelled import PRs
              id: poll
              env:
                  GH_TOKEN: ${{ '{{' }} steps.app-token.outputs.token {{ '}}' }}
                  COMPONENT: ${{ '{{' }} matrix.component {{ '}}' }}
                  ORG: ${{ '{{' }} github.repository_owner {{ '}}' }}
                  # Empty on schedule runs; on manual dispatch restricts to one
                  # component. Filtered in bash so the null/empty case is unambiguous.
                  ONLY_COMPONENT: ${{ '{{' }} github.event.inputs.only_component {{ '}}' }}
              run: |
                  set -euo pipefail
                  if [ -n "${ONLY_COMPONENT}" ] && [ "${ONLY_COMPONENT}" != "${COMPONENT}" ]; then
                    echo "Skipping ${COMPONENT}: manual run targeted '${ONLY_COMPONENT}' only."
                    echo "count=0" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  # Fail fast if the gate label was deleted on the mirror.
                  if ! gh label list --repo "${ORG}/${COMPONENT}" --limit 200 | grep -q '^import-to-monorepo'; then
                    echo "::error::Label 'import-to-monorepo' not found on ${ORG}/${COMPONENT}. Recreate it before imports can resume."
                    exit 1
                  fi
                  prs="$(gh pr list --repo "${ORG}/${COMPONENT}" --label import-to-monorepo --state open --json number --jq '.[].number')"
                  printf '%s\n' "$prs" > /tmp/import_prs.txt
                  count="$(printf '%s\n' "$prs" | grep -c . || true)"
                  echo "count=${count}" >> "$GITHUB_OUTPUT"
                  if [ "$count" -eq 0 ]; then
                    echo "No ${COMPONENT} PRs labelled import-to-monorepo on this cycle."
                  else
                    echo "Found ${count} labelled import PR(s) on ${COMPONENT}: $(printf '%s' "$prs" | tr '\n' ' ')"
                  fi

            - name: Import each labelled PR (mirror PR -> monorepo PR under <component>/)
              if: steps.poll.outputs.count != '0' && github.event.inputs.poll_only != 'true'
              env:
                  # The Go sync wrapper passes GITHUB_TOKEN through to the copybara
                  # container for the github_pr_* REST calls.
                  GITHUB_TOKEN: ${{ '{{' }} steps.app-token.outputs.token {{ '}}' }}
                  COMPONENT: ${{ '{{' }} matrix.component {{ '}}' }}
              run: |
                  set -euo pipefail
                  prs="$(cat /tmp/import_prs.txt)"
                  imported=0
                  while IFS= read -r pr_number; do
                    [ -z "$pr_number" ] && continue
                    echo "::group::Importing ${COMPONENT} PR #${pr_number}"
                    # The tested Go wrapper rewrites @@PR_NUMBER@@, sets
                    # COPYBARA_SOURCEREF, and runs the pinned copybara image. It exits
                    # 0 for success AND no-op (skip-guard / nothing to import); a real
                    # failure exits non-zero and fails this step under `set -e`.
                    bazel run //tools/copybara/sync -- import_pr "${COMPONENT}" "${pr_number}"
                    imported=$((imported + 1))
                    echo "::endgroup::"
                  done <<< "$prs"
                  echo "Import summary (${COMPONENT}): ${imported} PR(s) processed."

            - name: Regenerate gazelle BUILD files on each import PR branch
              if: steps.poll.outputs.count != '0' && github.event.inputs.poll_only != 'true'
              env:
                  GH_TOKEN: ${{ '{{' }} steps.app-token.outputs.token {{ '}}' }}
                  COMPONENT: ${{ '{{' }} matrix.component {{ '}}' }}
              run: |
                  set -euo pipefail
                  prs="$(cat /tmp/import_prs.txt)"
                  while IFS= read -r pr_number; do
                    [ -z "$pr_number" ] && continue
                    BR="${COMPONENT}-import-pr-${pr_number}"
                    echo "::group::Tidy BUILD on ${BR}"
                    # The branch only exists if the import was non-no-op.
                    if ! git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
                      echo "No import PR branch (${BR}) -- skipping tidy (import no-op'd or PR unlabelled)."
                      echo "::endgroup::"
                      continue
                    fi
                    pushed=""
                    for attempt in 1 2 3 4 5; do
                      git fetch origin "$BR"
                      git checkout -B "$BR" "origin/$BR"
                      bazel run //:tidy
                      git add -A
                      if git diff --cached --quiet; then
                        echo "BUILD already up to date on ${BR} -- nothing to regenerate."
                        pushed="ok"
                        break
                      fi
                      git commit -m "chore(bazel): tidy BUILD for ${COMPONENT} import PR #${pr_number}"
                      if git push origin "HEAD:refs/heads/$BR"; then
                        echo "Pushed BUILD regeneration onto ${BR}."
                        pushed="ok"
                        break
                      fi
                      echo "push rejected (attempt ${attempt}/5) -- branch advanced; re-syncing"
                      sleep $((attempt * 3))
                    done
                    if [ -z "$pushed" ]; then
                      echo "::error::could not push BUILD regeneration onto ${BR}"
                      echo "::endgroup::"
                      exit 1
                    fi
                    echo "::endgroup::"
                  done <<< "$prs"
