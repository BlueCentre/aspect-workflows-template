{%- if not minimal %}
    - title: Features
      properties:
{%- if not lint %}
        enableLinting:
          title: Enable Formatting and Linting
          type: boolean
          description: Setup format and linting using rules_lint
          default: true
{%- endif %}
{%- if not stamp %}
        enableStamping:
          title: Enable Version Stamping
          type: boolean
          description: Setup version stamping for releases
          default: false
{%- endif %}
{%- if not oci %}
        enableOCI:
          title: Enable OCI Containers
          type: boolean
          description: Setup OCI container builds with rules_oci
          default: false
{%- endif %}
        enableCodegen:
          title: Enable Code Generation Tools
          type: boolean
          description: Install copier (Python), yeoman (JS), and scaffold (Go)
          default: false
{%- endif %}

###############################################################################

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        # tools/initializer/ is the application initializer engine: a jinja2
        # TEMPLATE tree, not source. Its files carry placeholders that
        # `aspect render-app` substitutes LATER, from inside the scaffolded
        # repo. fetch:template Nunjucks-renders skeleton/** right now, and
        # Nunjucks renders an undefined name as the empty string -- so without
        # this the engine would arrive with every placeholder erased.
        #
        # copyWithoutTemplating copies matched files' CONTENTS verbatim; paths
        # are still rendered, which is fine because no path under
        # tools/initializer/ contains a placeholder. It is the key the action
        # actually reads: @backstage/plugin-scaffolder-backend 4.0.2 still
        # accepts the deprecated copyWithoutRender in its input schema but
        # never looks at it (see resolveTemplateActionSettings in
        # dist/scaffolder/actions/builtin/fetch/templateActionHandler.cjs.js).
        copyWithoutTemplating:
          - 'tools/initializer/**'
        values:
          name: ${{ '{{' }} parameters.name {{ '}}' }}
          description: ${{ '{{' }} parameters.description {{ '}}' }}
          owner: ${{ '{{' }} parameters.owner {{ '}}' }}
          destination: ${{ '{{' }} parameters.repoUrl | parseRepoUrl {{ '}}' }}
{%- if not minimal %}
          languages:
{%- if javascript %}
            - JavaScript & TypeScript
{%- endif %}
{%- if python %}
            - Python
{%- endif %}
{%- if go %}
            - Go
{%- endif %}
{%- if java %}
            - Java
{%- endif %}
{%- if kotlin %}
            - Kotlin
{%- endif %}
{%- if cpp %}
            - C & C++
{%- endif %}
{%- if rust %}
            - Rust
{%- endif %}
{%- if swift %}
            - Swift
{%- endif %}
{%- if shell %}
            - Shell (Bash)
{%- endif %}
{%- endif %}
{%- if not minimal %}
{%- if not lint %}
          enableLinting: ${{ '{{' }} parameters.enableLinting {{ '}}' }}
{%- endif %}
{%- if not stamp %}
          enableStamping: ${{ '{{' }} parameters.enableStamping {{ '}}' }}
{%- endif %}
{%- if not oci %}
          enableOCI: ${{ '{{' }} parameters.enableOCI {{ '}}' }}
{%- endif %}
          enableCodegen: ${{ '{{' }} parameters.enableCodegen {{ '}}' }}
{%- endif %}

    # - id: fetchWorkflows
    #   name: Install Github Workflows
    #   action: fetch:plain
    #   input:
    #     url: ./cloud-run-workflows
    #     targetPath: ./code

    - id: publish
      name: Create GitHub repo
      action: publish:github
      input:
        repoUrl: ${{ '{{' }} parameters.repoUrl {{ '}}' }}
        description: ${{ '{{' }} parameters.description {{ '}}' }}
        defaultBranch: main
        repoVisibility: private
        # token: ${{ '{{' }} secrets.USER_OAUTH_TOKEN {{ '}}' }}
        deleteBranchOnMerge: true
        gitCommitMessage: "Initial commit from Aspect Workflows template"

    # - id: publish
    #   name: Create GitHub repo
    #   action: publish:github
    #   input:
    #     repoUrl: ${{ '{{' }} parameters.repoUrl {{ '}}' }}
    #     description: Hello World deployment for ${{ '{{' }} parameters.serviceName {{ '}}' }}
    #     sourcePath: ./code
    #     #token: ${{ '{{' }} secrets.USER_OAUTH_TOKEN {{ '}}' }}e
    #     defaultBranch: main
    #     repoVariables:
    #       LANGUAGE: python
    #       SERVICE_NAME: ${{ '{{' }} parameters.serviceName {{ '}}' }}
    #       REGION: ${{ '{{' }} parameters.region {{ '}}' }}
    #       ARTIFACT_REGISTRY_REPO: ${{ '{{' }} parameters.arRepo {{ '}}' }}
    #       ARTIFACT_REGISTRY_LOCATION: ${{ '{{' }} parameters.arLocation {{ '}}' }}
    #       PROJECT_ID: ${{ '{{' }} parameters.gcpProjectId {{ '}}' }}
    #       WIF_PROVIDER: projects/${{ '{{' }} parameters.wifProjectNumber {{ '}}' }}/locations/global/workloadIdentityPools/${{ '{{' }} parameters.wifPoolName{{ '}}' }}/providers/${{ '{{' }} parameters.wifProviderName {{ '}}' }}
    #       WIF_SERVICE_ACCOUNT: ${{ '{{' }} parameters.wifServiceAccount {{ '}}' }}
    #     secrets:
    #       WIF_PROVIDER: projects/${{ '{{' }} parameters.wifProjectNumber {{ '}}' }}/locations/global/workloadIdentityPools/${{ '{{' }} parameters.wifPoolName{{ '}}' }}/providers/${{ '{{' }} parameters.wifProviderName {{ '}}' }}
    #       WIF_SERVICE_ACCOUNT: ${{ '{{' }} parameters.wifServiceAccount {{ '}}' }}

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ '{{' }} steps.publish.output.repoContentsUrl {{ '}}' }}
        catalogInfoPath: '/catalog-info.yaml'

###############################################################################

  output:
    links:
      - title: Repository
        url: ${{ '{{' }} steps.publish.output.remoteUrl {{ '}}' }}
      - title: Open in Backstage
        icon: catalog
        entityRef: ${{ '{{' }} steps.register.output.entityRef {{ '}}' }}
    text:
      - title: Next Steps
        content: |
          # Welcome to your new Aspect Workflows project! 🎉

          Your repository has been created at: ${{ '{{' }} steps.publish.output.remoteUrl {{ '}}' }}

          ## Getting Started

          1. Clone the repository:
             ```bash
             git clone ${{ '{{' }} steps.publish.output.remoteUrl {{ '}}' }}
             cd ${{ '{{' }} parameters.name {{ '}}' }}
             ```

          2. Read the developer guide in `/README.bazel.md`

          3. Setup your dev environment:
             ```bash
             bazel run //tools:bazel_env
             ```
             Note: This requires installing direnv: https://direnv.net/

          4. Try out some commands:
{%- if lint %}
             - Format: `format`
             - Lint: `aspect lint //...`
{%- else %}
             - Format: `format` (if enabled)
             - Lint: `aspect lint //...` (if enabled)
{%- endif %}
             - Run tests: `aspect test //...`
             - Watch mode: `ibazel run //my:devserver`

          5. Add source code and run `bazel run gazelle` to generate BUILD files

          ## Resources

          - 🌟 Star Aspect CLI: https://github.com/aspect-build/aspect-cli
          - 📚 Documentation: https://docs.aspect.build/
          - 💬 Join Bazel Slack: https://slack.bazel.build (#aspect-build channel)
