name: CLA Assistant

# EXAMPLE / TEMPLATE -- not active where it sits. For each one-way mirror, copy
# this file into  <component>/.github/workflows/cla.yml  in the MONOREPO (so the
# export carries it to the mirror's .github/workflows/cla.yml), copy
# tools/copybara/cla/CLA.md to <component>/CLA.md, and replace <org>/<component>
# below. See docs/copybara-oneway-sync.md.
#
# AUTHORING / EXPORT MODEL: authored in the monorepo under <component>/ so
# export_<component> carries it down to the mirror root. It is NOT in
# copy.bara.sky's `standalone_only` set, so it IS synced and runs IN THE MIRROR.
#
# GATE ORDERING: a contributor signs the CLA (this check goes green) BEFORE a
# maintainer applies the 'import-to-monorepo' label; the monorepo poll only
# imports labelled PRs, so CLA-signing precedes import.
#
# CREDENTIALS: uses ONLY the mirror's built-in secrets.GITHUB_TOKEN. No monorepo
# secret is referenced or reachable here.

on:
    pull_request_target:
        types: [opened, closed, synchronize]
    issue_comment:
        types: [created]

permissions:
    contents: write
    pull-requests: write
    statuses: write
    actions: write

jobs:
    cla:
        runs-on: ubuntu-latest
        steps:
            - name: CLA Assistant Lite
              if: (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
              uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
              env:
                  # Mirror's built-in token ONLY.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
                  path-to-signatures: "signatures/version1/cla.json"
                  branch: "cla-signatures"
                  # EDIT <org>/<component>: must be PUBLICLY readable on the mirror's main.
                  path-to-document: "https://github.com/<org>/<component>/blob/main/CLA.md"
                  allowlist: "dependabot[bot],renovate[bot],*[bot]"
