name: CI
on:
  push:
    branches: [main, platform-v2.0]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

# The aspect-launcher and bazelisk resolve their versions via the GitHub
# releases API. Unauthenticated that API is capped at 60 req/hr by source IP,
# which the macOS legs blow through on a cold cache (all presets stampede the
# API at once on the first-ever macOS run) → "403 API rate limit exceeded".
# Authenticate those calls with the job token to get the 5000 req/hr limit.
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BAZELISK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Render every preset from the local template tree (via the shared renderer the
  # `aspect init` command also uses) and prove the generated workspace is valid:
  # repin lockfiles, then build/test, and lint/format for lint-enabled presets.
  # This gates template changes BEFORE they land on main.
  preset:
    strategy:
      fail-fast: false
      matrix:
        preset:
          - minimal
          - shell
          - go
          - js
          - py
          - java
          - kotlin
          - cpp
          - rust
          - ruby
          - scala
          - kitchen-sink
          - swift
          - copybara-go
          - copybara-oneway
          - backstage-go
          - backstage-py
          - backstage-kitchen-sink
        # macOS runners are billed at 10x Linux on GHA, so only exercise them
        # on main pushes (where Apple-Silicon-only breakage like the
        # distroless linux/arm64/v8 manifest bug would otherwise slip through);
        # PRs stay Linux-only.
        os: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/platform-v2.0')) && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        exclude:
          # rules_swift's xcode_swift_toolchain can't parse the macos-latest
          # Xcode 16.4 SDK with our pinned rules_swift main commit. Swift is
          # verified on Linux (hermetic toolchain), and the delivered swift
          # starter's own CI runs Linux-only — so skip swift on macOS here.
          - preset: swift
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # rules_swift's Linux toolchain links via the configured CC toolchain,
      # which must be clang; ubuntu defaults to gcc. The swift-only preset has no
      # cpp/LLVM toolchain to provide clang, so export CC=clang before the first
      # bazel call. (kitchen-sink's cpp already registers a clang LLVM toolchain.)
      - name: Use clang for Swift (Linux)
        if: ${{ matrix.preset == 'swift' && matrix.os == 'ubuntu-latest' }}
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Aspect CLI
        uses: aspect-build/setup-aspect@36c688a9bbb0c84d55d7eca31bf3215e9d265bff # v2026.24.1
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}

      # Render + post-scaffold EXACTLY as the aspect-starters publish job does
      # (publish-starters.yaml), so the tree the check steps below see is
      # byte-for-byte what a published starter ships. The check steps then run
      # the SAME tasks the stamped CI (template/.github/workflows/ci.yaml) runs
      # downstream — so a green run here means the starter repos are green too.
      - name: Render + post-scaffold (repin, normalize)
        run: |
          aspect render-preset --preset='${{ matrix.preset }}' --out="$RUNNER_TEMP/out" --name=my_project
          echo "WS=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/out"
          # repin — the template ships placeholder lockfiles; regenerate them.
          if [ -x ./tools/repin ]; then ./tools/repin; fi
          bazel mod deps --lockfile_mode=update || true
          # git init FIRST — gazelle/format need a git tree to enumerate + apply.
          git init -q
          git add -A
          git -c user.email=ci@aspect.build -c user.name=CI commit -q -m "rendered ${{ matrix.preset }}"
          # Normalize (buildifier + gazelle + format), mirroring the publish job.
          bazel run --run_in_cwd @buildifier_prebuilt//buildifier -- -r . || true
          aspect gazelle --task:name gazelle-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false --check-only=false || true
          case "${{ matrix.preset }}" in
            minimal|scala|ruby) ;;
            *) aspect format --task:name format-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false --scope=all || true ;;
          esac
          git add -A
          git -c user.email=ci@aspect.build -c user.name=CI commit -q --amend --no-edit || true

      # Assert the multitool-pinned aspect-launcher matches the version in
      # tools.lock.json. The launcher prints `aspect launcher <version>` for
      # `--version`; we derive the expected version from this repo's lockfile so
      # the check stays in sync with future bumps. Run the launcher target via
      # Bazel in the rendered workspace so we exercise the exact pinned binary.
      - name: Assert aspect-launcher version
        working-directory: ${{ env.WS }}
        run: |
          expected="$(
            grep -o 'aspect-cli/releases/download/v[^/]*/' "$GITHUB_WORKSPACE/template/tools/tools.lock.json" \
              | head -n1 | sed -E 's#.*/download/v##; s#/$##'
          )"
          echo "Expected launcher version: $expected"
          actual="$(bazel run @multitool//tools/aspect -- --version)"
          echo "Actual: $actual"
          if [ "$actual" != "aspect launcher $expected" ]; then
            echo "::error::aspect-launcher version mismatch: expected 'aspect launcher $expected', got '$actual'" >&2
            exit 1
          fi

      # Statically validate the generated GitHub Actions workflow itself
      # (syntax, expressions, permissions). GitHub can't run a rendered workflow
      # as a nested CI run, so actionlint is how we gate the YAML pre-merge; the
      # aspect-starters publish job is the live end-to-end run post-merge.
      - name: Lint generated workflows (actionlint)
        working-directory: ${{ env.WS }}
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            *)      os=linux ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            *)             arch=amd64 ;;
          esac
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_${os}_${arch}.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yaml

      # No separate build step: `aspect test` builds everything it needs.
      - name: Test
        working-directory: ${{ env.WS }}
        run: aspect test --task:name test-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false -- //...

      # The steps below run the SAME tasks the generated project's CI
      # (template/.github/workflows/ci.yaml) runs, with the same per-preset
      # gating, so this matrix is a faithful proxy for the starter repos. All
      # use --scope=all: these run in the rendered project ($WS), but a task's
      # PR-diff detection would otherwise key off THIS repo's changed files.

      # buildifier always runs (Starlark; only needs buildifier_prebuilt).
      - name: Buildifier
        working-directory: ${{ env.WS }}
        run: aspect buildifier --task:name buildifier-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false --scope=all

      # gazelle runs for every preset (the stamped CI always has a gazelle job).
      - name: Gazelle (no changes expected)
        working-directory: ${{ env.WS }}
        run: aspect gazelle --task:name gazelle-check-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false

      # Lint runs only for presets with a wired rules_lint aspect (matches the
      # stamped CI's lint-job gating and .aspect/config.axl's aspects list).
      # go/scala have no linter; rust lints via clippy (aspect_rules_lint_rust).
      #
      # The clang-tidy aspect (cpp, and cpp-in-kitchen-sink) is skipped on macOS:
      # rules_lint's _update_flag strips absolute `-isystem` paths as if they were
      # MSVC `/flags`, so the macOS SDK libc++ include is dropped and clang-tidy
      # can't find <string>/<iostream>. Build/test/format still run on macOS for
      # cpp. Re-enable once https://github.com/aspect-build/rules_lint/issues/924
      # ships (PR #779).
      - name: Lint
        if: ${{ !contains(fromJSON('["minimal","go","scala","swift","copybara-go","copybara-oneway","backstage-go"]'), matrix.preset) && !(matrix.os == 'macos-latest' && contains(fromJSON('["cpp","kitchen-sink","backstage-kitchen-sink"]'), matrix.preset)) }}
        working-directory: ${{ env.WS }}
        run: aspect lint --task:name lint-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false -- //...

      # format runs for every preset with a wired source formatter. scala/ruby
      # have none; minimal has no languages (buildifier covers its Starlark).
      - name: Format (no changes expected)
        if: ${{ !contains(fromJSON('["minimal","scala","ruby","swift"]'), matrix.preset) }}
        working-directory: ${{ env.WS }}
        run: aspect format --task:name format-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false --scope=all

      # delivery runs for presets whose stamped CI has a delivery job (oci/stamp).
      # --track-state=false --mode=always mirrors the stamped delivery job.
      - name: Delivery
        if: ${{ contains(fromJSON('["go","kitchen-sink"]'), matrix.preset) }}
        working-directory: ${{ env.WS }}
        run: aspect delivery --task:name delivery-${{ matrix.preset }}-${{ matrix.os }} --github-status-comments:enabled=false --github-status-checks:enabled=false --track-state=false --mode=always

      # Execute the preset's user story — an executable-Markdown tutorial that
      # builds/tests/extends the generated project. Run with `sh` (the ~~~ alias
      # trick needs POSIX-sh alias expansion; bash non-interactive won't expand
      # it). See https://gist.github.com/bwoods/1c25cb7723a06a076c2152a2781d4d49
      - name: User story
        working-directory: ${{ env.WS }}
        run: |
          story="$GITHUB_WORKSPACE/user_stories/${{ matrix.preset }}.md"
          if [ -f "$story" ]; then sh "$story"; else echo "no user story for ${{ matrix.preset }} — skipping"; fi

  # The application-composition contract and its render smoke, plus the one
  # property that decides whether the initializer is usable at all: a stamped
  # application's BUILD file must be exactly what gazelle would generate.
  #
  # Since ADR-026 the engine ships INSIDE every starter, so the gated product is
  # the embedded copy: most steps here render a starter first and then run that
  # starter's own `tools/initializer/`. The AWT-root steps that remain gate the
  # source (the development mount), not the product.
  #
  # Ordered cheapest-first as far as the mounts allow. The AWT-root
  # check-metadata/check-renders need no bazel, so they return a verdict in
  # seconds and fail fast on a bad contract. Everything embedded has to wait for
  # a host to exist -- there is no engine outside a repo that carries one -- and
  # the gazelle proof additionally needs bazel, since there is no way to ask
  # gazelle what it would generate without building it. The whole job runs
  # independently of the preset matrix so a broken contract does not wait on 18
  # preset builds.
  app-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Aspect CLI
        uses: aspect-build/setup-aspect@36c688a9bbb0c84d55d7eca31bf3215e9d265bff # v2026.24.1
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}

      # The engine has TWO mount points (ADR-026). It is authored here as
      # `template/tools/initializer/` and shipped verbatim into every starter as
      # `tools/initializer/`, so the steps below are ordered by which mount they
      # gate:
      #
      #   1. the AWT root -- the DEVELOPMENT mount. Gates the source: the
      #      contract is consistent, the sampled selections render, and
      #      `render-app` still runs in place for whoever is editing the engine.
      #   2. inside a rendered starter -- the CONSUMPTION mount, which is the
      #      product. Everything a user ever runs is proven there, from the
      #      starter's own checkout, using the starter's own copy of the engine.
      #
      # Steps 2 come after the hosts are rendered because that is the only place
      # an embedded engine exists: there is no engine outside a repo that
      # carries one.

      - name: Validate the application metadata contract (development mount)
        run: aspect check-metadata

      - name: Render sampled selections and inspect the output (development mount)
        run: aspect check-renders

      # One happy-path render from the AWT root, so the development mount stays
      # gated: if `template/tools/initializer/` ever stops being runnable in
      # place, whoever is editing the engine finds out here rather than after a
      # deliver. Explicit flags because a scratch `--out` has no host above it.
      - name: Render an application from the AWT root (development mount)
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/scratch/dev_mount_probe"
          aspect render-app --language=go --name=dev_mount_probe --out="$probe" \
            --module-path=example.com/dev_host \
            --package-path=app/dev_mount_probe \
            --host-oci=no
          if ! grep -qF 'name = "dev_mount_probe"' "$probe/BUILD.bazel"; then
            echo "the AWT-root mount rendered a BUILD.bazel with no target named after the app:"
            cat "$probe/BUILD.bazel"
            exit 1
          fi
          echo "development mount: render-app runs from the AWT root"

      # Render a monorepo and NORMALIZE it, committing that as the baseline. The
      # normalize pass is what isolates the property under test: a freshly
      # rendered preset is not itself a gazelle fixed point (jinja conditionals
      # leave blank lines gazelle reflows), and the preset matrix above already
      # normalizes before it asserts. Without the baseline commit the fixed-point
      # step would fail on the host template's whitespace and never say anything
      # about the application.
      #
      # Two hosts, because the stamped BUILD file's shape depends on the
      # destination rather than on the application. `go` ships bazel/oci and
      # enables the go_image gazelle extension; `copybara-go` is a Go host with
      # NO bazel/oci, where emitting a go_image target would load a file that
      # does not exist and break `bazel build //...` for the whole repo.
      #
      # These hosts are also what every embedded step below runs INSIDE: each
      # one carries its own `tools/initializer/`, delivered by this render.
      - name: Render and normalize the two hosts
        run: |
          set -euo pipefail
          for preset in go copybara-go; do
            mono="$RUNNER_TEMP/mono-$preset"
            cd "$GITHUB_WORKSPACE"
            aspect render-preset --preset="$preset" --out="$mono" --name=my_project
            cd "$mono"
            # Materialize MODULE.bazel.lock BEFORE anything invokes bazel. The
            # template ships no lockfile, and the rendered repo's own preset
            # bazelrc sets `common:ci --lockfile_mode=error` (.aspect/config.axl
            # adds --config=ci whenever $CI is set), so the very first bazel
            # call -- building //tools/gazelle:gazelle -- dies with "Missing
            # checksum for registry file ... not permitted with
            # --lockfile_mode=error" before gazelle ever runs. The preset matrix
            # solves this in its own normalize step; this job skipped it.
            # `|| true` mirrors that step verbatim.
            #
            # It runs before the baseline commit, so the lockfile is part of the
            # baseline rather than an untracked file the post-stamping
            # `git diff --cached` would report as an application defect.
            bazel mod deps --lockfile_mode=update || true
            git init -q
            git add -A
            git -c user.email=ci@aspect.build -c user.name=CI commit -qm "rendered"
            # `|| true`: with --check-only=false gazelle APPLIES its changes and
            # still exits 1 to report that the files had been out of date, which
            # a freshly rendered preset always is (jinja conditionals leave
            # blank lines gazelle reflows). The preset matrix tolerates it the
            # same way. That tolerance would also swallow a genuine gazelle
            # failure, so the next line re-runs gazelle in CHECK mode with no
            # `|| true`: the baseline must be a PROVEN fixed point before a
            # single application is stamped, or the comparison below means
            # nothing.
            aspect gazelle --task:name "gazelle-app-baseline-$preset" \
              --github-status-comments:enabled=false --github-status-checks:enabled=false \
              --check-only=false || true
            aspect gazelle --task:name "gazelle-app-baseline-verify-$preset" \
              --github-status-comments:enabled=false --github-status-checks:enabled=false \
              --severity=fail --check-only=true
            git add -A
            git -c user.email=ci@aspect.build -c user.name=CI commit -qm "normalized" --allow-empty
          done

      # The same two checks as above, but run from INSIDE a rendered starter --
      # the mount every user actually has. They are pure AXL (no bazel), so this
      # costs seconds and proves the delivered `tools/initializer/` is
      # self-contained: the contract it reads, the app templates it renders and
      # the tasks file `MODULE.aspect` names all shipped, and `_base()` resolves
      # the starter mount rather than the template-repo one.
      #
      # `--out-dir` is pointed outside the starter on purpose: nothing a check
      # writes may land in the repo under test, or the fixed-point verdict below
      # would be comparing against the checks' own scratch output.
      - name: Run the embedded engine's own checks inside a starter
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mono-go"
          aspect check-metadata
          aspect check-renders --out-dir="$RUNNER_TEMP/embedded-check-renders"

      # Regression guard for a data-loss bug: `--out` is REMOVED before
      # rendering, so a `--out` that is itself a module root would delete the
      # go.mod render-app just read. The refusal existed but compared a
      # normalized module root against the RAW --out argument, so `<root>/` and
      # `<root>/.` walked straight past it and deleted the host module. Every
      # spelling of the same directory must refuse, and the host must survive.
      #
      # Run embedded: the destructive path is the one users have, and it is the
      # starter's own copy of the engine that has to refuse.
      - name: Refuse to stamp onto a module root, however --out is spelled
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mono-go"
          host="$RUNNER_TEMP/hostmod"
          for spelling in "$host/" "$host/." "$host" "$host/app/../../hostmod"; do
            rm -rf "$host"
            mkdir -p "$host"
            printf 'module example.com/hostmod\n\ngo 1.24\n' > "$host/go.mod"
            echo "DO-NOT-DELETE" > "$host/KEEPFILE"
            if aspect render-app --language=go --name=hostmod --out="$spelling" \
                 --module-path=example.com/x --package-path=app/x --host-oci=no > "$RUNNER_TEMP/refusal.log" 2>&1; then
              echo "--out='$spelling' was ACCEPTED; it must be refused as a module root."
              echo "surviving files:"
              find "$host" -mindepth 1 -maxdepth 1
              exit 1
            fi
            if ! grep -q -- "--out is itself a Go module root" "$RUNNER_TEMP/refusal.log"; then
              echo "--out='$spelling' failed, but not with the module-root refusal:"
              cat "$RUNNER_TEMP/refusal.log"
              exit 1
            fi
            if [ ! -f "$host/go.mod" ] || [ "$(cat "$host/KEEPFILE" 2>/dev/null)" != "DO-NOT-DELETE" ]; then
              echo "--out='$spelling' refused but still damaged the host module."
              exit 1
            fi
            echo "refused and host intact: --out='$spelling'"
          done

      # The P1 calling convention, exercised in exactly the shape a frontend
      # will use it: CLONE THE TARGET REPO, RUN ITS ENGINE, render to a scratch
      # directory, open a PR. So the working directory is a starter (that is
      # where an embedded engine exists at all -- outside a repo carrying
      # `tools/initializer/` there is none to run) while `--out` is OUTSIDE it,
      # with no go.mod above it, which is what makes every destination property
      # unobservable and the flags mandatory.
      #
      # Nothing else in CI exercises that form -- the fixed-point step below
      # always stamps INTO the starter, where all three are derived. Assert the
      # two properties the flags exist to control: the import path is the module
      # path joined with the package path (NOT with --out's location, which
      # differs here on purpose, and which is NOT the starter we are standing
      # in), and --host-oci=no emits no go_image.
      - name: Render with the explicit-flags calling convention
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mono-go"
          probe="$RUNNER_TEMP/scratch/convention_probe"
          aspect render-app --language=go --name=convention_probe --out="$probe" \
            --module-path=example.com/my_project \
            --package-path=services/convention_probe \
            --host-oci=no
          if ! grep -qF 'importpath = "example.com/my_project/services/convention_probe"' "$probe/BUILD.bazel"; then
            echo "--module-path + --package-path did not reach importpath:"
            grep -n importpath "$probe/BUILD.bazel" || echo "  (no importpath at all)"
            exit 1
          fi
          if grep -q go_image "$probe/BUILD.bazel"; then
            echo "--host-oci=no still emitted a go_image target, which breaks \`bazel build //...\` on a host without bazel/oci:"
            grep -n go_image "$probe/BUILD.bazel"
            exit 1
          fi
          echo "explicit-flags convention: importpath and host_oci both honoured"

      # The verdict this job exists for, run the way a user runs it: from the
      # starter's own root, with the starter's own engine, no flags -- every
      # destination property is derived from the repo the command is standing
      # in. `--out` is relative for the same reason: that is the documented form.
      #
      # Three stampings per host: `payments` under app/ is the happy path,
      # `payments_api` proves a snake_case name does not drift into kebab-case
      # target names, and `services/billing` proves the import path tracks where
      # the application actually lands.
      - name: Prove a stamped application is a gazelle fixed point
        run: |
          set -euo pipefail
          for preset in go copybara-go; do
            cd "$RUNNER_TEMP/mono-$preset"
            aspect render-app --language=go --name=payments     --out=./app/payments
            aspect render-app --language=go --name=payments_api --out=./app/payments_api
            aspect render-app --language=go --name=billing      --out=./services/billing

            git add -A
            git -c user.email=ci@aspect.build -c user.name=CI commit -qm "stamped"
            aspect gazelle --task:name "gazelle-app-fixedpoint-$preset" \
              --github-status-comments:enabled=false --github-status-checks:enabled=false \
              --check-only=false
            # The verdict. `git add -A` first: gazelle CREATES BUILD files as
            # well as editing them, and a created file is untracked, which plain
            # `git diff --exit-code` reports as clean. Staging first makes the
            # comparison HEAD-vs-index, so additions and deletions count too.
            #
            # Any difference means gazelle disagreed with what we stamped, which
            # is the same red the target monorepo's stale-BUILD gate would show
            # on the first stamping PR. Do NOT silence it with
            # `# gazelle:ignore` -- that hides exactly what this exists to catch.
            git add -A
            git diff --cached --exit-code
          done

      # A fixed point that does not build is worthless: assert the stamped
      # applications compile, their tests pass, and (on the oci host) their
      # images assemble.
      - name: Build and test the stamped applications
        run: |
          set -euo pipefail
          for preset in go copybara-go; do
            cd "$RUNNER_TEMP/mono-$preset"
            bazel test //app/... //services/...
          done

  # Stable name for branch protection: "every preset leg and the application
  # contract passed". app-contract is aggregated here rather than required on
  # its own so branch protection keeps a single check to name.
  conclusion:
    needs: [preset, app-contract]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.preset.result, 'failure') || needs.preset.result == 'failure' }}" = "true" ]; then
            echo "one or more presets failed" && exit 1
          fi
          if [ "${{ needs.app-contract.result }}" != "success" ]; then
            echo "the application contract job did not pass (${{ needs.app-contract.result }})" && exit 1
          fi
          echo "all presets and the application contract passed"
